<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- ============================================
         SENAI Exchange - Tela de Chat/Conversa
         Página de mensagens entre usuários
         ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens | SENAI Exchange</title>


    <!-- Arquivos CSS separados -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/chat.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>

<body>
    <!-- ============================================
         HEADER / NAVEGAÇÃO PRINCIPAL
         ============================================ -->
    <header class="header">
        <!-- Logo do sistema -->
        <a href="../index.html" class="header__logo">
            <img src="../assets/logo_senai_troca-sem-fundo.png" alt="SENAI Exchange" class="header__logo-img">
        </a>

        <!-- Navegação Principal -->
        <nav class="header__nav">
            <a href="../index.html" class="header__nav-link">Explorar</a>
            <a href="meus-pedidos.html" class="header__nav-link">Trocas</a>
            <a href="chat.html" class="header__nav-link">Mensagens</a>
            <a href="novo-anuncio.html" class="header__nav-link">Novo Anuncio</a>
            <a href="catalogo.html" class="header__nav-link">Catalogo</a>
            <a href="perfil.html" class="header__nav-link">Meu Perfil</a>

        </nav>

        <!-- Ações do Header -->
        <div class="header__actions">
            <div class="header__search">
            </div>
            <a href="login.html" class="auth-header-link">Entrar</a>
            <a href="cadastro.html" class="auth-header-link">Criar Conta</a>
        </div>
    </header>

    <!-- ============================================
         CONTAINER PRINCIPAL DO CHAT
         Divide a tela em sidebar de conversas e área de chat
         ============================================ -->
    <main class="chat-container">

        <!-- ============================================
         SIDEBAR DE CONVERSAS
         Lista de todas as conversas do usuário
         ============================================ -->
        <aside class="chat-sidebar">
            <!-- Cabeçalho da sidebar (Estilo WhatsApp) -->
            <div class="chat-sidebar__header">
                <!-- Avatar do usuário atual (gerado dinamicamente) -->
                <div id="sidebar-user-avatar" class="chat-sidebar__user-avatar" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f,#0056b3);color:white;font-weight:700;font-size:18px;border-radius:50%;width:40px;height:40px;">?</div>
                
                <!-- Ações -->
                <div class="chat-sidebar__actions">
                    <button class="chat-action-btn" title="Status">
                        <svg class="icon icon--sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                    <button class="chat-action-btn" title="Nova Conversa">
                        <svg class="icon icon--sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button class="chat-action-btn" title="Menu">
                        <svg class="icon icon--sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Lista de conversas (populada dinamicamente pelo chat.js) -->
            <div class="chat-sidebar__list">
                <!-- Carregando conversas... -->
                <p style="padding:16px;color:#9ca3af;font-size:13px;text-align:center;">Carregando...</p>
            </div>
        </aside>

        <!-- ============================================
             ÁREA PRINCIPAL DO CHAT
             Onde as mensagens são exibidas
             ============================================ -->
        <section class="chat-main">

            <!-- ============================================
                 HEADER DO CHAT
                 Informações do contato e item sendo negociado
                 ============================================ -->
            <header class="chat-header">
                <!-- Informações do contato (populadas pelo chat.js) -->
                <div class="chat-header__contact">
                    <button class="chat-header__back-btn" aria-label="Voltar para conversas">
                        <svg class="icon icon--sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <!-- Avatar gerado dinamicamente via JS -->
                    <img src="" alt="" class="chat-header__avatar" style="display:none;">
                    <div class="chat-header__info">
                        <div class="chat-header__name">Selecione uma conversa</div>
                        <div class="chat-header__status"></div>
                    </div>
                </div>

                <!-- Ações do chat -->
                <div class="chat-header__actions">
                    <button class="chat-header__finalize-btn" disabled title="Selecione uma conversa">Finalizar Troca</button>
                </div>
            </header>

            <!-- ============================================
                 Área de mensagens (populada dinamicamente pelo chat.js)
                 ============================================ -->
            <div class="chat-messages">
                <!-- Estado inicial exibido pelo chat.js -->
            </div>

            <!-- ============================================
                 INPUT DE MENSAGEM
                 Campo para digitar e enviar mensagens
                 ============================================ -->
            <div class="chat-input">
                <div class="chat-input__container">
                    <!-- Campo de texto com ações -->
                    <div class="chat-input__field">
                        <!-- Botão de anexo -->
                        <button class="chat-input__action-btn">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                        </button>

                        <!-- Input de texto -->
                        <input type="text" id="chat-message-input" placeholder="Selecione uma conversa para começar..." disabled>

                        <!-- Ações adicionais -->
                        <div class="chat-input__actions">
                            <!-- Emoji -->
                            <button class="chat-input__action-btn">
                                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </button>
                            <!-- Imagem -->
                            <button class="chat-input__action-btn">
                                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Botão de enviar -->
                    <button class="chat-input__send-btn">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>

                <!-- Aviso de segurança -->
                <p class="chat-input__safety-notice">
                    Mantenha as trocas na plataforma para Proteção e Garantia de Segurança
                </p>
            </div>

        </section>
    </main>
</body>
<script src="../scripts/api.js"></script>
<script src="../scripts/chat.js"></script>

</html>
